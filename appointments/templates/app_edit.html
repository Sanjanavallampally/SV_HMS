<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        body {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title mb-4">Update your Appointment</h2>
                        {% if error %}
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            {{ error }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        {% endif %}
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="patient_name" class="form-label">patient_name</label>
                                <input type="text" class="form-control" id="name" name="patient_name" placeholder="Enter patient name" value="{{ appointment.patient.name }}" required>
                            </div>

                            <div class="mb-3">
                                <label for="doctor_name" class="form-label">doctor_name</label>
                                <input type="text" class="form-control" id="name" name="doctor_name" placeholder="Enter doctor name" value="{{ appointment.doctor.name }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="appointment_date_time" class="form-label">Appointment Date and Time</label>
                                <div class="d-flex gap-2">
                                    <input type="date" class="form-control" id="appointment_date" name="appointment_date" value="{{ appointment.appointment_time|date:'Y-m-d' }}" required>
                                    <input type="time" class="form-control" id="appointment_time" name="appointment_time" value="{{ appointment.appointment_time|time:'H:i' }}" required>
                                </div>
                            </div>
        
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Update Appointment</button>
                                <a href="/appointments" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                        <hr>
                        <div class="mt-3">
                            <h5 class="text-muted">Available Patients:</h5>
                            <p class="text-muted small">
                                {% for patient in patients %}
                                    <span class="badge bg-info">{{ patient.name }}</span>
                                {% endfor %}
                            </p>
                            <h5 class="text-muted">Available Doctors:</h5>
                            <p class="text-muted small">
                                {% for doctor in doctors %}
                                    <span class="badge bg-info">{{ doctor.name }}</span>
                                {% endfor %}
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
