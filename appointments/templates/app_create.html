<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        body {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title mb-4">Create An Appointment</h2>
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="patient_name" class="form-label">Patient Name</label>
                                <select class="form-control" id="patient_name" name="patient_name" required>
                                    <option value="">Select a patient</option>
                                    {% for patient in patients %}
                                    <option value="{{ patient.name }}">{{ patient.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="doctor_name" class="form-label">Doctor Name</label>
                                <select class="form-control" id="doctor_name" name="doctor_name" required>
                                    <option value="">Select a doctor</option>
                                    {% for doctor in doctors %}
                                    <option value="{{ doctor.name }}">{{ doctor.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="appointment_date_time" class="form-label">Appointment Date and Time</label>
                                <div class="d-flex gap-2">
                                    <input type="date" class="form-control" id="appointment_date" name="appointment_date" required>
                                    <input type="time" class="form-control" id="appointment_time" name="appointment_time" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="appointment_status" class="form-label">Appointment Status</label>
                                <select class="form-control" id="appointment_status" name="appointment_status" required>
                                    <option value="">Select status</option>
                                    <option value="Scheduled">Scheduled</option>
                                    <option value="Confirmed">Confirmed</option>
                                    <option value="Completed">Completed</option>
                                    <option value="Cancelled">Cancelled</option>
                                    <option value="No-show">No-show</option>
                                </select>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Create Appointment</button>
                                <a href="/appointments" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
